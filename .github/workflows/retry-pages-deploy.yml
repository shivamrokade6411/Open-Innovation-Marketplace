name: Retry Pages Deploy

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 2 }}
    runs-on: ubuntu-latest
    steps:
      - name: Retry failed pages deployment jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: gh api --method POST "repos/${REPO}/actions/runs/${RUN_ID}/rerun-failed-jobs"
